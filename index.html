      <h1>AI-Worker — Free MIT Open-Source Desktop AI Workspace for macOS, Windows &amp; Linux</h1>
      <p>AI-Worker is a free open-source desktop application for chat, files, browser automation,
        MCP tools, and provider-agnostic LLM workflows.</p>

      <h2>Key Features</h2>
      <ul>
        <li>Use chat, file drag-and-drop, and workflow starter tiles</li>
        <li>Connect MCP tools for memory, filesystem, MarkItDown, and browser automation</li>
        <li>Choose Ollama, OpenAI-compatible APIs, Gemini, OpenRouter, auto mode, or on-device paths where available</li>
        <li>Free MIT open-source software — no account, no credit card required</li>
      </ul>

      <h2>Install AI-Worker</h2>
      <p>Available for macOS (Apple Silicon &amp; Intel), Windows 10/11, and Linux.</p>
      <h3>macOS &amp; Linux (Terminal)</h3>
      <pre><code>curl -fsSL https://downloads.ai-worker.tech/install-mac.sh | bash</code></pre>
      <h3>Windows (PowerShell)</h3>
      <pre><code>irm https://downloads.ai-worker.tech/install-windows.ps1 | iex</code></pre>

      <h2>How It Works</h2>
      <p>AI-Worker uses browser automation and the Model Context Protocol to perform real actions inside connected
        tools. Non-developers can configure providers and built-in connections from the desktop UI; developers can add
        custom MCP servers.</p>

      <h2>Enterprise Setup</h2>
      <p>For enterprise ecosystem setup, provider policy mapping, and internal MCP integrations, contact
        <a href="mailto:contact@ai-worker.tech">contact@ai-worker.tech</a>.</p>

      <h2>Get Started</h2>
      <p>Download AI-Worker at <a href="https://ai-worker.tech/download">ai-worker.tech/download</a> or inspect the
        source at <a href="https://github.com/meharajM/ai-worker.app">github.com/meharajM/ai-worker.app</a>.</p>
